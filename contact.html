<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact and student feedback form.">
    <title>Contact Us - Web Systems & Technology</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Web Systems & Technology Team Project</h1>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="schedule.html">Schedule</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="contact.html">Contact Us</a></li>
        </ul>
    </nav>
</header>

<main>

    <h1>Contact & Student Feedback</h1>

    <form action="#" method="POST">

        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" name="fullname">

        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email">

        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password">

        <br><br>

        <p>Role:</p>

        <input type="radio" id="student" name="role" value="student">
        <label for="student">Student</label>

        <input type="radio" id="teacher" name="role" value="teacher">
        <label for="teacher">Teacher</label>

        <br><br>

        <p>Interests:</p>

        <input type="checkbox" id="html" name="interest" value="html">
        <label for="html">HTML</label>

        <input type="checkbox" id="css" name="interest" value="css">
        <label for="css">CSS</label>

        <input type="checkbox" id="github" name="interest" value="github">
        <label for="github">GitHub</label>

        <br><br>

        <label for="message">Message:</label>
        <br>

        <textarea id="message" name="message" rows="5" cols="40"></textarea>

        <br><br>

        <label for="subject">Subject:</label>

        <select id="subject" name="subject">
            <option value="feedback">Feedback</option>
            <option value="question">Question</option>
            <option value="suggestion">Suggestion</option>
        </select>

        <br><br>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>

    </form>

</main>

<footer>
    <p>&copy; 2026 Web Systems & Technology Team</p>
</footer>

</body>
</html>
